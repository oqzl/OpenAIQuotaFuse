name: Shell wrapper

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: bash -n shell/openai-quota-fuse.sh
      - name: Wrapper delegates to Python
        run: |
          test "$(./shell/openai-quota-fuse.sh --version)" = "0.10.0-dev"
          test "$(PYTHON=python ./shell/openai-quota-fuse.sh --version)" = "0.10.0-dev"
